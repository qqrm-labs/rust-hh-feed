name: Manual Release

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: 'Optional: widen the fetch window for one-off backfills, typically 72'
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-bot:
    uses: ./.github/workflows/post.yml
    permissions:
      contents: write
      actions: write
    with:
      backfill_hours: ${{ inputs.backfill_hours }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEV_TELEGRAM_CHAT_ID: ${{ secrets.DEV_TELEGRAM_CHAT_ID }}
