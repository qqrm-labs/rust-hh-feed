name: Release Binary

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/action.yml'
      - '.github/scripts/release_manifest.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact checked commit requested by the dependency merge controller
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_PROGRESS_WHEN: never

    steps:
      - name: Verify publication commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --quiet

      - name: Publish binary to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title latest --notes "Automated latest build"
          fi

          python3 .github/scripts/release_manifest.py create target/release/rust-hh-feed delivery-manifest.json
          gh release upload latest target/release/rust-hh-feed --clobber
          gh release upload latest delivery-manifest.json --clobber
