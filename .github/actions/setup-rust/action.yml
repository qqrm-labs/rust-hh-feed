name: Setup Rust
description: Install the repository toolchain and maintained Rust check tools

inputs:
  toolchain:
    description: Optional toolchain override; otherwise use rust-toolchain.toml
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy, rustfmt
        cache: false
        rustflags: ''
    - name: Install cargo-machete
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
      with:
        tool: cargo-machete@0.9.2,cargo-audit@0.22.0
        fallback: none
